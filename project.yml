name: BetterStreamflix
options:
  bundleIdPrefix: com.betterstreamflix
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    OTHER_LDFLAGS: "$(inherited) -framework AppIntents"
    DEVELOPMENT_TEAM: ""
targets:
  BetterStreamflix:
    type: application
    platform: iOS
    sources:
      - BetterStreamflix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betterstreamflix.ios
        INFOPLIST_FILE: BetterStreamflix/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BetterStreamflix/Resources/BetterStreamflix.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.2
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - BetterStreamflixTests
  BetterStreamflixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BetterStreamflixTests
    dependencies:
      - target: BetterStreamflix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betterstreamflix.ios.tests
